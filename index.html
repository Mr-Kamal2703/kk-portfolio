function AnimatedAboutChar({ char, index, total, scrollYProgress }) {
  const start = index / total;
  const end = (index + 1) / total;
  const opacity = useTransform(scrollYProgress, [start, end], [0.15, 1]);
  return (
    <span style={{ position: 'relative', display: 'inline' }}>
      <span style={{ opacity: 0, userSelect: 'none' }}>{char}</span>
      <motion.span style={{ position: 'absolute', left: 0, top: 0, opacity }}>{char}</motion.span>
    </span>
  );
}

function AnimatedAboutText({ text, scrollYProgress }) {
  return (
    <>
      {text.split('').map((char, i) => (
        <AnimatedAboutChar
          key={`${char}-${i}`}
          char={char}
          index={i}
          total={text.length}
          scrollYProgress={scrollYProgress}
        />
      ))}
    </>
  );
}

/* Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬

Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬Ã¢â€â‚¬ */
const MARQUEE_ITEMS = [
  'React', 'Next.js', 'Tailwind CSS', 'JavaScript', 'Node.js', 'Framer Motion',
  'GSAP', 'Figma', 'Firebase', 'MySQL', 'REST APIs', 'TypeScript',
  'HTML5', 'CSS3', 'Git', 'Responsive Design',
];

function MarqueeSection() {
  const [offset, setOffset] = useState(0);
  useEffect(() => {
    let raf;
    const tick = () => {
      setOffset(o => o + 0.5);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  const itemW = 220;
  const total = MARQUEE_ITEMS.length;
  const mod = (total * itemW);

  return (
    <section className="skills-marquee" style={{
      background: '#0C0C0C', overflow: 'hidden',
      padding: 'clamp(48px, 6vw, 80px) 0',
      borderTop: '1px solid rgba(215,226,234,0.06)',
      borderBottom: '1px solid rgba(215,226,234,0.06)',
    }}>
      <div style={{ display: 'flex', gap: '0', willChange: 'transform',
        transform: `translateX(-${offset % mod}px)` }}>
        {[...MARQUEE_ITEMS, ...MARQUEE_ITEMS, ...MARQUEE_ITEMS].map((item, i) => (
          <div key={i} className="marquee-item" style={{
            display: 'flex', alignItems: 'center', gap: '16px',
            flexShrink: 0, width: `${itemW}px`,
          }}>
            <span style={{
              color: '#D7E2EA', fontWeight: 500,
              fontSize: 'clamp(0.9rem, 1.4vw, 1.1rem)',
              textTransform: 'uppercase', letterSpacing: '0.08em',
              whiteSpace: 'nowrap',
            }}>{item}</span>
            <span style={{ color: 'rgba(215,226,234,0.2)', fontSize: '20px', flexShrink: 0 }}>*</span>
          </div>
        ))}
      </div>
    </section>
  );
}

    e.preventDefault();

        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
        },
        body: JSON.stringify({
          name: form.name,
          email: form.email,
          message: form.message,
          _subject: `Portfolio Inquiry from ${form.name}`,
          _captcha: 'false',
        }),
      });

      if (!response.ok) {
        throw new Error('Form submission failed');
      }

      setSent(true);
      setForm({ name: '', email: '', message: '' });
    } catch (error) {
      window.location.href = `mailto:kk40232@gmail.com?subject=Portfolio Inquiry from ${encodeURIComponent(form.name)}&body=${encodeURIComponent(form.message + '\n\nFrom: ' + form.name + '\nEmail: ' + form.email)}`;
